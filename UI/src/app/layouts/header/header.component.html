<mat-toolbar class="app-header" color="primary">
  <button mat-icon-button (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-title">AI Timesheet Agent</span>

  <span class="flex-1"></span>

  <button mat-icon-button (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Switch to light' : 'Switch to dark'">
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>
